<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<style>
  html{background:#fff}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:9mm}
  body{background:#fff;font-size:12px}
  .wrap{max-width:none;padding:0}
  .lh{padding:0 0 9px !important}
  .lh-co{font-size:14px}.lh-tag{font-size:10.5px}.lh-coord{font-size:10px}
  .cover{margin:10px 0 4px !important;padding:24px 28px 20px !important;border-radius:15px !important;break-inside:avoid}
  .cover h1{font-size:30px !important;letter-spacing:-.9px;max-width:22ch}
  .cv-kick{margin-bottom:9px !important;font-size:10px !important}
  .cv-lede{font-size:11.5px !important;margin-top:10px !important;max-width:100ch}
  .cv-stats{margin-top:14px !important;gap:8px !important}
  .cv-stat{padding:9px 13px !important;flex:1 1 110px}
  .cv-stat b{font-size:19px !important}.cv-stat span{font-size:8.5px !important}
  main{padding:0 !important}
  .blk{padding:12px 0 6px !important;border-top:1px solid var(--line-soft)}
  .blkhead{margin-bottom:9px !important;gap:13px !important}
  .ix{padding:4px 8px !important;font-size:11px !important}
  .kick{font-size:9.5px !important;margin-bottom:4px !important}
  .blk h2{font-size:18px !important;letter-spacing:-.4px}
  .thesis{font-size:11px !important;margin-top:5px !important;max-width:none}
  .replaces{margin-top:6px !important;font-size:10px !important}
  .grid{grid-template-columns:repeat(3,1fr) !important;gap:8px !important}
  .card{padding:11px 13px !important;border-radius:11px !important;box-shadow:none !important;break-inside:avoid}
  .ch{margin-bottom:9px !important;gap:9px !important}
  .ic{width:32px !important;height:32px !important;border-radius:8px}
  .ic svg{width:17px !important;height:17px !important}
  .ch h3{font-size:13px !important}
  .ch .sub{font-size:9.5px !important}
  .tag{font-size:8px !important;padding:2px 6px !important}
  .fx{gap:2.5px !important}
  .fx li{font-size:10.4px !important;padding-left:15px;line-height:1.32}
  .fx li::before{top:5px;width:6.5px;height:6.5px}
  .ben{margin-top:9px !important;padding-top:7px !important;font-size:10.3px !important}
  .ben .bl{font-size:8.5px !important}
  /* offer — stays on ONE page, compact card grid */
  .offer{padding:15px 17px !important;box-shadow:none !important;border-radius:13px;break-inside:avoid}
  .pills{gap:6px !important;margin-bottom:10px !important}
  .pill{font-size:9.5px !important;padding:4px 9px !important}
  .vs-legend{gap:12px !important;margin:2px 0 9px !important}
  .vs-lg{font-size:9.5px !important}
  .vs-grid{grid-template-columns:repeat(3,1fr) !important;gap:8px !important}
  .vs-card{padding:9px 12px !important;border-radius:10px !important;box-shadow:none !important;break-inside:avoid}
  .vs-crit{font-size:11.5px !important;margin-bottom:6px !important}
  .vs-own,.vs-saas{font-size:10.4px !important;padding-left:20px;line-height:1.34}
  .vs-own{margin-bottom:5px !important}
  .offer-foot{margin-top:10px !important;font-size:10.8px !important}
  /* screenshots side by side */
  .shots{display:grid !important;grid-template-columns:1fr 1fr !important;gap:14px !important;align-items:start}
  .shot{break-inside:avoid;margin:0}
  .shot img{width:100% !important;max-width:100% !important;max-height:none}
  .shot figcaption{font-size:10.5px !important;margin-top:7px !important}
  /* security */
  .sec-intro{gap:14px !important;margin-bottom:13px !important;break-inside:avoid}
  .badges{gap:6px !important}
  .badge{font-size:10.5px !important;padding:5px 10px !important;box-shadow:none !important}
  .dind{padding:13px !important;box-shadow:none !important;break-inside:avoid}
  .ring{font-size:10.5px !important}
  footer{padding:16px 0 0 !important;margin-top:10px}
  .foot-note{font-size:10.5px}
  .blkhead,.blk h2,.kick{break-after:avoid}
</style>
